<!-- mailing_management/templates/mailing_management/recipients_list.html -->
{% extends 'mailing_management/base.html' %}
{% block content %}
<div class="container mt-5">
  <h2 class="mb-4">
    {% if object %}
      Редактировать получателя
    {% else %}
      Добавить получателя
    {% endif %}
  </h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">
      {% if object %}
        Сохранить
      {% else %}
        Создать
      {% endif %}
    </button>
    <a href="{% url 'mailing_management:recipients_list' %}" class="btn btn-secondary ms-2">Отмена</a>
  </form>
</div>
{% endblock %}
