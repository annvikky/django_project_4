<h2>Пользователи</h2>
<table border="1" cellpadding="5">
  <thead>
    <tr>
      <th>Имя</th>
      <th>Email</th>
      <th>Активен</th>
      <th>Действия</th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.is_active|yesno:"Да,Нет" }}</td>
      <td>
        {% if user != request.user %}
          {% if user.is_active %}
            <a href="{% url 'users:block_user' user.pk %}">Заблокировать</a>
          {% else %}
            <em>Заблокирован</em>
          {% endif %}
        {% else %}
          <em>Вы</em>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
